name: Part 2 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          set -e
          missing=0
          for p in README.md RaceDay.sln RaceDay/RaceDay.csproj RaceDay/Program.cs \
                   RaceDay/Controllers RaceDay/Models RaceDay/DTOs RaceDay/Database \
                   RaceDay.Tests/RaceDay.Tests.csproj; do
            if [ -e "$p" ]; then echo "OK      $p"; else echo "MISSING $p"; missing=1; fi
          done
          exit $missing

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test RaceDay.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
